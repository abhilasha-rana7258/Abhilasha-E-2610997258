<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>College Website</title>
</head>
<!-- Task 2: Divide the remaining area into two sections using columns -->
<frameset rows="15%, *" border="1">
    <!-- Header Frame -->
    <frame src="header.html" name="header_frame" scrolling="no" noresize>
    
    <!-- Nested frameset for Navigation and Main Content columns -->
    <frameset cols="20%, *" border="1">
        <!-- Task 5: Give the navigation frame a suitable name -->
        <frame src="nav.html" name="nav_frame">
        <!-- Main Content Frame -->
        <frame src="home.html" name="content_frame">
    </frameset>
</frameset>
</html>
