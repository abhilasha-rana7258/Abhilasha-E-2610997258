<!DOCTYPE html>
<html>
<head>
    <title>Explore the World – Travel Agency</title>
</head>
<!-- Divides the window into 3 horizontal sections: Header (20%), Main Content (65%), Footer (15%) -->
<frameset rows="20%, 65%, 15%" border="1" framespacing="1">
    
    <!-- Task 1 & 4: Header Frame -->
    <frame src="header.html" name="header_frame" scrolling="no" noresize>

    <!-- Nested Frameset for Main Content: Divided into 3 vertical columns -->
    <frameset cols="25%, 45%, 30%" border="1">
        <!-- Task 3: Navigation Column -->
        <frame src="navigation.html" name="nav_frame">
        
        <!-- Task 3: Tourist Destinations Column (Loads home.html by default) -->
        <frame src="home.html" name="content_frame">
        
        <!-- Task 3: Travel Packages Column -->
        <frame src="packages.html" name="package_frame">
    </frameset>

    <!-- Task 10: Footer Frame -->
    <frame src="footer.html" name="footer_frame" scrolling="no" noresize>

</frameset>
</html>
