<!DOCTYPE html>
<html lang="en">
<head>
    <title>Reader's Haven - Book Registration & Order Form</title>
</head>
<body>

    <h2>Reader's Haven - Book Registration & Order Form</h2>
    <form action="submit_order.php" method="POST" target="_blank">
        <input type="hidden" name="form_type" value="Readers Haven Book Order">
        <label for="cust-name">Customer Name:</label>
        <input type="text" id="cust-name" name="customer_name" placeholder="Enter your full name" required><br><br>
        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email address" required><br><br>
        <label for="mobile">Mobile Number:</label>
        <input type="tel" id="mobile" name="mobile" placeholder="Enter your mobile number" required><br><br>
        <label for="age">Age:</label>
        <input type="number" id="age" name="age" min="1" max="120"><br><br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" required><br><br>
        <label for="category">Favorite Book Category:</label>
        <select id="category" name="book_category" required>
            <option value="">--Select Category--</option>
            <option value="Fiction">Fiction</option>
            <option value="Science">Science</option>
            <option value="History">History</option>
            <option value="Children’s Books">Children’s Books</option>
        </select><br><br>
        <label for="book-title">Book Title:</label>
        <input type="text" id="book-title" name="book_title" placeholder="Enter book title" required><br><br>
        <label for="quantity">Quantity:</label>
        <input type="number" id="quantity" name="quantity" min="1" value="1" required><br><br>
        <label for="delivery-date">Delivery Date:</label>
        <input type="date" id="delivery-date" name="delivery_date" required><br><br>
        <label for="delivery-time">Preferred Delivery Time:</label>
        <input type="time" id="delivery-time" name="delivery_time" required><br><br>
        <label>Preferred Payment Method:</label>
        <input type="radio" id="cod" name="payment_method" value="Cash on Delivery" required>
        <label for="cod">Cash on Delivery</label>
        <input type="radio" id="online" name="payment_method" value="Online Payment">
        <label for="online">Online Payment</label><br><br>
        <label>Additional Services:</label>
        <input type="checkbox" id="gift" name="services[]" value="Gift Wrapping">
        <label for="gift">Gift Wrapping</label>
        <input type="checkbox" id="bookmark" name="services[]" value="Bookmark">
        <label for="bookmark">Bookmark</label>
        <input type="checkbox" id="express" name="services[]" value="Express Delivery">
        <label for="express">Express Delivery</label>
        <input type="checkbox" id="greeting" name="services[]" value="Greeting Card">
        <label for="greeting">Greeting Card</label><br><br>
        <label for="reference-doc">Upload Reference Image/Document:</label>
        <input type="file" id="reference-doc" name="reference_doc" accept="image/*,.pdf"><br><br>
        <label for="address">Delivery Address & Special Instructions:</label><br>
        <textarea id="address" name="delivery_address" rows="4" cols="30" placeholder="Enter your full delivery address and any special notes..." required></textarea><br><br>
        <button type="submit">Submit</button>
        <button type="reset">Reset</button>

    </form>

</body>
</html>
